name = "ktv-assistant"
main = "worker/index.ts"
compatibility_date = "2026-06-23"

[vars]
YOUTUBE_SEARCH_DAILY_LIMIT = "100"
YOUTUBE_SEARCH_MAX_CALLS_PER_FILL = "12"
SEARCH_CACHE_TTL_DAYS = "365"
SEARCH_CACHE_MAX_ENTRY_BYTES = "524288"
SEARCH_RATE_LIMIT_PER_MINUTE = "20"
ADMIN_LOGIN_RATE_LIMIT_PER_MINUTE = "5"
CLOUDFLARE_ACCOUNT_ID = "7b1b04c010c424952c9d2cbcbea76145"
CLOUDFLARE_D1_DATABASE_ID = "a2fe987b-5191-4ac3-9d01-f923d19c731a"
CLOUDFLARE_D1_DATABASE_NAME = "ktv-assistant-db"
CLOUDFLARE_KV_NAMESPACE_ID = "aedd751919314f9e81f1917e59a859bd"
CLOUDFLARE_KV_NAMESPACE_NAME = "SEARCH_CACHE"
CLOUDFLARE_STORAGE_METRICS_TTL_SECONDS = "300"

[assets]
directory = "dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ktv-assistant-db"
database_id = "a2fe987b-5191-4ac3-9d01-f923d19c731a"

[[kv_namespaces]]
binding = "SEARCH_CACHE"
id = "aedd751919314f9e81f1917e59a859bd"

[[durable_objects.bindings]]
name = "ROOM_OBJECT"
class_name = "RoomDurableObject"
script_name = "ktv-assistant-room"
